<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Pasted app icon. Rebuild AppIcon.icns with scripts/make_icon.sh. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6E6AF7"/>
      <stop offset="1" stop-color="#3B2DB5"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="tile-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#140A50" flood-opacity="0.45"/>
    </filter>
    <clipPath id="front">
      <rect x="252" y="372" width="520" height="400" rx="52"/>
    </clipPath>
  </defs>

  <!-- Tile on the macOS icon grid: 824 x 824 at 100, continuous corners. -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tile-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>

  <!-- Older items stacked behind. -->
  <rect x="332" y="236" width="360" height="300" rx="40" fill="#FFFFFF" fill-opacity="0.38"/>
  <rect x="292" y="300" width="440" height="340" rx="46" fill="#FFFFFF" fill-opacity="0.62"/>

  <!-- The newest item, drawn like a Pasted card: app-colored header, text below. -->
  <g filter="url(#card-shadow)">
    <rect x="252" y="372" width="520" height="400" rx="52" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#front)">
    <rect x="252" y="372" width="520" height="112" fill="#FF9F0A"/>
  </g>
  <circle cx="318" cy="428" r="26" fill="#FFFFFF"/>
  <rect x="362" y="414" width="180" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="300" y="530" width="424" height="32" rx="16" fill="#3B2DB5" fill-opacity="0.85"/>
  <rect x="300" y="594" width="360" height="32" rx="16" fill="#3B2DB5" fill-opacity="0.45"/>
  <rect x="300" y="658" width="260" height="32" rx="16" fill="#3B2DB5" fill-opacity="0.45"/>
</svg>
