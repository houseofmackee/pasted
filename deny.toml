# Dependency policy checked in CI with `cargo deny check`.
# Only permissive licenses, so the shipped app can stay MIT OR Apache-2.0.

[graph]
targets = ["aarch64-apple-darwin"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9
# Allowed ahead of time; not every allowed license is in use yet.
unused-allowed-license = "allow"
# Mozilla's CA certificates, bundled by ureq for HTTPS.
exceptions = [{ crate = "webpki-roots", allow = ["CDLA-Permissive-2.0"] }]

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
