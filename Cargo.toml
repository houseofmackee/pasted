[package]
name = "pasted"
version = "0.2.0"
edition = "2024"
description = "A fast, private clipboard manager for macOS"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "pasted"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
base64 = "0.22"
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
getrandom = "0.3"
hmac = "0.12"
libc = "0.2"
lzfse_rust = "0.2"
nucleo-matcher = "0.3.1"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-service-management = "0.3"
objc2-vision = "0.3"
percent-encoding = "2"
plist = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled-sqlcipher"] }
security-framework = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
url = "2"
uuid = { version = "1", features = ["v4"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[[test]]
name = "card_layout"
harness = false

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "store"
harness = false
