[package]
name = "pasted"
version = "0.1.0"
edition = "2024"
description = "A fast, private clipboard manager for macOS"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "pasted"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
flate2 = "1"
lzfse_rust = "0.2"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"
objc2-service-management = "0.3"
objc2-vision = "0.3"
plist = "1"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = "3"
url = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
